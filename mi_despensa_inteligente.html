<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Despensa Inteligente</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#24352e;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;background:#286b52;color:white;font-weight:650}button:hover{filter:brightness(.94)}button.secondary{background:#e5efe9;color:#285842}button.danger{background:#fff0ed;color:#aa4036}button.small{padding:7px 10px;font-size:12px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d6e1d9;border-radius:10px;background:white;color:#273b31}input[type=checkbox]{width:19px;height:19px;accent-color:#286b52}label{display:block;font-size:12px;font-weight:700;color:#5b7064;margin-bottom:5px}h1,h2,h3,p{margin-top:0}h1{font-size:26px;letter-spacing:-.8px}h2{font-size:20px}h3{font-size:16px}small,.muted{color:#718578}.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{background:#173f33;color:#fff;padding:26px 15px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:850;line-height:1.2;padding:5px 12px 25px}.brand span{font-size:29px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;text-align:left;color:#c7dfd0;font-weight:550;padding:13px}.nav button.active,.nav button:hover{background:#2b5d4c;color:#fff}.sidefoot{font-size:11px;color:#b6d0bf;padding:25px 12px}.main{padding:30px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:23px}.top p{color:#789083;margin:5px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:white;border:1px solid #e5ede7;border-radius:17px;box-shadow:0 3px 14px #183e2a08}.card{padding:18px}.card .label{font-size:12px;color:#75877c}.card .value{font-size:25px;font-weight:800;margin:8px 0}.card .hint{font-size:12px;color:#6d8c78}.panel{padding:21px;margin-bottom:17px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:17px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.field{min-width:0}.full{grid-column:1/-1}.progress{height:11px;background:#e8efe9;border-radius:99px;overflow:hidden;margin:15px 0 9px}.progress>div{height:100%;background:#4d9c75;border-radius:99px}.progress>div.warn{background:#e6a84d}.progress>div.over{background:#d65d53}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:700px}th{font-size:12px;color:#718679;font-weight:750;background:#f8faf8}td,th{padding:12px 9px;border-bottom:1px solid #edf1ed}td{font-size:13px}td strong{color:#253d30}.pill{display:inline-block;border-radius:99px;background:#e9f3ec;color:#397154;padding:5px 9px;font-size:11px;font-weight:700}.pill.orange{background:#fff0d8;color:#a56a1b}.pill.red{background:#ffebe8;color:#a4443a}.notice{background:#f1f8f2;border:1px solid #d9e9dc;padding:12px 14px;border-radius:12px;margin:12px 0;font-size:13px}.notice.warn{background:#fff7e9;border-color:#f3dfb6;color:#865b1c}.notice.error{background:#fff0ed;border-color:#f4d1cc;color:#a33c35}.empty{padding:35px;text-align:center;color:#819386}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input{max-width:280px}.toolbar select{max-width:220px}.right{text-align:right}.barrow{display:grid;grid-template-columns:125px 1fr 85px;gap:10px;align-items:center;margin:13px 0;font-size:12px}.barbg{background:#edf2ed;height:12px;border-radius:20px;overflow:hidden}.barfill{background:#66a785;height:100%;border-radius:20px}.barfill.alt{background:#e0ac62}.modalback{position:fixed;inset:0;background:#0d231b91;display:flex;justify-content:center;align-items:center;padding:16px;z-index:10}.modal{background:white;border-radius:19px;padding:25px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal h2{margin-bottom:20px}.hidden{display:none!important}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tabs button{background:#e8f0ea;color:#3d6c50}.tabs button.active{background:#286b52;color:white}.statline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e9eee9}.chip{display:inline-block;background:#e8f0eb;border-radius:99px;padding:5px 10px;font-size:12px;margin:3px}.footer{color:#819487;font-size:12px;margin-top:24px}.mobileNav{display:none}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:750px){.shell{display:block}.side{display:none}.main{padding:18px 13px 95px}.top{align-items:flex-start;flex-direction:column}.cards{gap:9px}.card{padding:14px}.card .value{font-size:21px}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobileNav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e0e9e2;display:flex;overflow-x:auto;z-index:5;padding:7px;gap:5px}.mobileNav button{background:transparent;color:#647e6e;min-width:85px;font-size:11px;padding:8px 5px}.mobileNav button.active{background:#e1f0e5;color:#225d44}.panel{padding:16px}.barrow{grid-template-columns:80px 1fr 65px}}@media(max-width:390px){.formgrid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><span>🥬</span> Mi Despensa<br>Inteligente</div><nav id="nav" class="nav"></nav><div class="sidefoot">Tus compras, bajo control.<br>Datos guardados en este dispositivo.</div></aside><main class="main"><div class="top"><div><h1 id="title">Inicio</h1><p id="subtitle">Organiza tu despensa y aprovecha lo que tienes.</p></div><div class="actions"><button class="secondary small" onclick="exportData()">↓ Exportar</button><button class="secondary small" onclick="document.getElementById('importFile').click()">↑ Importar</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div></div><div id="content"></div><div class="footer">Mi Despensa Inteligente · Los importes se expresan en pesos mexicanos (MXN). El ahorro es una estimación, no dinero recibido.</div></main></div><nav id="mobileNav" class="mobileNav"></nav><div id="modalRoot"></div><script>
'use strict';
const KEY='mi-despensa-inteligente-v1', cats=['Frutas y verduras','Carnes y pollo','Lácteos y huevo','Abarrotes','Bebidas','Limpieza','Higiene personal','Mascotas','Otros'], units=['piezas','kg','gramos','litros','mililitros','paquetes','cajas','botellas','latas'];
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Monterrey'});const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(+n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Math.max(0,Number(v)||0);const datePlus=n=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};const dayDiff=d=>d?Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000):null;
const demo=()=>({version:1,period:'semanal',budget:1800,periodStart:today(),categories:[...cats],inventory:[{id:uid(),name:'Arroz',category:'Abarrotes',qty:1.5,unit:'kg',min:1,bought:datePlus(-6),expiry:datePlus(180),price:38},{id:uid(),name:'Leche',category:'Lácteos y huevo',qty:1,unit:'litros',min:2,bought:datePlus(-2),expiry:datePlus(3),price:29},{id:uid(),name:'Manzanas',category:'Frutas y verduras',qty:4,unit:'piezas',min:6,bought:datePlus(-3),expiry:datePlus(5),price:48},{id:uid(),name:'Pasta',category:'Abarrotes',qty:2,unit:'paquetes',min:1,bought:datePlus(-5),expiry:datePlus(200),price:25}],shopping:[{id:uid(),name:'Huevos',qty:1,unit:'paquetes',estimated:65,real:0,bought:false,date:'',inventoryId:''},{id:uid(),name:'Leche',qty:1,unit:'litros',estimated:29,real:0,bought:false,date:'',inventoryId:''}],history:[],meals:[],savings:0});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||demo()}catch{state=demo()}if(!Array.isArray(state.inventory)||!Array.isArray(state.shopping)||!Array.isArray(state.history))state=demo();state.categories=Array.isArray(state.categories)?state.categories:[...cats];state.meals=state.meals||[];state.savings=num(state.savings);let page='inicio',filter='',categoryFilter='',historyFilter='todos',expiryFilter='todos';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('No se pudo guardar en este navegador. Exporta tus datos para conservarlos.')}}
function normalize(s){return String(s||'').trim().toLocaleLowerCase('es-MX')};function findItem(name,unit){return state.inventory.find(i=>normalize(i.name)===normalize(name)&&i.unit===unit)}function periodDays(){return {semanal:7,quincenal:15,mensual:30}[state.period]||7}function endPeriod(){return datePlusFrom(state.periodStart,periodDays())}function datePlusFrom(d,n){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')}function periodEndText(){return endPeriod()}function activeHistory(){return state.history.filter(h=>h.date>=state.periodStart&&h.date<endPeriod())}function spent(){return activeHistory().reduce((a,h)=>a+num(h.total),0)}function pending(){return state.shopping.filter(x=>!x.bought).reduce((a,x)=>a+num(x.estimated)*num(x.qty),0)}function remaining(){return num(state.budget)-spent()}function expiryStatus(i){let d=dayDiff(i.expiry);return d===null?'Sin fecha':d<0?'Caducado':d<=3?'Por caducar pronto':d<=7?'Caduca esta semana':'Vigente'}function lowItems(){return state.inventory.filter(i=>num(i.qty)<num(i.min))}function expiring(){return state.inventory.filter(i=>i.qty>0&&i.expiry&&dayDiff(i.expiry)<=7)}function showPage(p){page=p;filter='';categoryFilter='';render()}
const pages=[['inicio','⌂','Inicio'],['inventario','▤','Mi inventario'],['compras','🛒','Lista de compras'],['calculadora','◫','Calculadora'],['historial','◷','Historial'],['sobrantes','♻','Lo que quedó'],['caducidades','◴','Caducidades'],['comidas','♨','Planificador']];function renderNav(){for(let id of ['nav','mobileNav'])document.getElementById(id).innerHTML=pages.map(([p,ic,n])=>`<button class="${page===p?'active':''}" onclick="showPage('${p}')">${ic} ${n}</button>`).join('')}
function render(){renderNav();document.getElementById('title').textContent=pages.find(x=>x[0]===page)[2];document.getElementById('subtitle').textContent=page==='inicio'?'Organiza tus compras, evita duplicados y cuida tu presupuesto.':`Periodo ${state.period} · ${state.periodStart} al ${periodEndText()} (fin exclusivo)`;const fn={inicio:home,inventario:inventoryPage,compras:shoppingPage,calculadora:calculatorPage,historial:historyPage,sobrantes:leftoversPage,caducidades:expiryPage,comidas:mealsPage};document.getElementById('content').innerHTML=fn[page]();}
function card(label,value,hint){return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint||''}</div></div>`}function progress(v,max){let pct=max>0?v/max*100:0;return `<div class="progress"><div class="${pct>100?'over':pct>=80?'warn':''}" style="width:${Math.min(100,Math.max(0,pct))}%"></div></div><small>${Math.round(pct)}% del presupuesto utilizado</small>`}function alerts(){let a=[];if(spent()+pending()>state.budget)a.push(`<div class="notice error">⚠ El gasto realizado más las compras previstas supera tu presupuesto en ${money(spent()+pending()-state.budget)}.</div>`);else if(spent()+pending()>=state.budget*.8)a.push('<div class="notice warn">⚠ Estás cerca del límite del presupuesto considerando compras pendientes.</div>');if(expiring().length)a.push(`<div class="notice warn">Tienes ${expiring().length} producto(s) próximos a vencer o caducados. Úsalos primero.</div>`);if(today()>=endPeriod())a.push(`<div class="notice warn">Tu periodo terminó. Puedes iniciar uno nuevo sin borrar inventario ni historial. <button class="small" onclick="resetPeriod()">Iniciar nuevo periodo</button></div>`);return a.join('')}
function home(){let s=spent(),r=remaining();return `<div class="cards">${card('Presupuesto',money(state.budget),state.period)}${card('Gastado',money(s),'Compras registradas')}${card('Disponible',money(r),r<0?'Presupuesto excedido':'Saldo del periodo')}${card('Ahorro estimado',money(state.savings),'Productos aprovechados')}${card('En inventario',state.inventory.filter(x=>x.qty>0).length,'Productos con existencia')}${card('Por reabastecer',lowItems().length,'Debajo del mínimo')}${card('Próximos a caducar',expiring().length,'Incluye caducados')}${card('Compras pendientes',state.shopping.filter(x=>!x.bought).length,money(pending())+' estimados')}</div>${alerts()}<div class="grid2"><section class="panel"><div class="row between"><h2>Presupuesto del periodo</h2><button class="secondary small" onclick="budgetModal()">Configurar</button></div>${progress(s,state.budget)}<div class="statline"><span>Gastado</span><strong>${money(s)}</strong></div><div class="statline"><span>Por comprar (estimado)</span><strong>${money(pending())}</strong></div><div class="statline"><span>Saldo tras compras previstas</span><strong>${money(r-pending())}</strong></div><div class="row" style="margin-top:16px"><button onclick="showPage('compras')">Ver lista de compras</button><button class="secondary" onclick="resetPeriod()">Nuevo periodo</button></div></section><section class="panel"><h2>Productos que necesitan atención</h2>${[...lowItems().slice(0,3).map(i=>`<div class="statline"><span>${esc(i.name)} · faltan ${Math.max(0,i.min-i.qty)} ${esc(i.unit)}</span><button class="small secondary" onclick="suggestPurchase('${i.id}')">Agregar</button></div>`),...expiring().slice(0,3).map(i=>`<div class="statline"><span>${esc(i.name)} · ${esc(expiryStatus(i))}</span><span class="pill orange">${esc(i.expiry)}</span></div>`)].join('')||'<div class="empty">Tu despensa está al día.</div>'}</section></div><section class="panel"><h2>Acciones rápidas</h2><div class="actions"><button onclick="itemModal()">+ Producto al inventario</button><button class="secondary" onclick="shopModal()">+ Producto a comprar</button><button class="secondary" onclick="showPage('sobrantes')">Registrar sobrantes</button><button class="secondary" onclick="showPage('comidas')">Planear comidas</button></div></section>`}
function inventoryPage(){let items=state.inventory.filter(i=>(!filter||normalize(i.name).includes(normalize(filter)))&&(!categoryFilter||i.category===categoryFilter));return `<section class="panel"><div class="row between"><h2>Inventario (${state.inventory.length})</h2><div class="actions"><button class="secondary" onclick="categoryModal()">+ Categoría</button><button onclick="itemModal()">+ Agregar producto</button></div></div><div class="toolbar"><input placeholder="Buscar producto..." value="${esc(filter)}" oninput="filter=this.value;refreshTable('invTable',inventoryTable())"><select onchange="categoryFilter=this.value;refreshTable('invTable',inventoryTable())"><option value="">Todas las categorías</option>${state.categories.map(c=>`<option ${categoryFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div id="invTable">${inventoryTable()}</div></section><div class="notice">Las existencias permanecen guardadas al cambiar de semana, quincena o mes. Solo se actualizan al registrar compras, consumos o cambios manuales.</div>`}
function refreshTable(id,html){document.getElementById(id).innerHTML=html}function inventoryTable(){let items=state.inventory.filter(i=>(!filter||normalize(i.name).includes(normalize(filter)))&&(!categoryFilter||i.category===categoryFilter));return items.length?`<div class="tablewrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Disponible</th><th>Mínimo</th><th>Caducidad</th><th>Precio</th><th>Acciones</th></tr></thead><tbody>${items.map(i=>`<tr><td><strong>${esc(i.name)}</strong><br><small>Compra: ${esc(i.bought||'—')}</small></td><td>${esc(i.category)}</td><td>${i.qty} ${esc(i.unit)} <button class="secondary small" onclick="adjustQty('${i.id}')">±</button></td><td>${i.min} ${esc(i.unit)} ${i.qty<i.min?'<span class="pill orange">Bajo</span>':''}</td><td>${esc(i.expiry||'—')}<br><span class="pill ${expiryStatus(i)==='Caducado'?'red':dayDiff(i.expiry)<=7?'orange':''}">${esc(expiryStatus(i))}</span></td><td>${money(i.price)}</td><td><button class="secondary small" onclick="itemModal('${i.id}')">Editar</button> <button class="danger small" onclick="deleteItem('${i.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay productos que coincidan.</div>'}
function shoppingPage(){return `<section class="panel"><div class="row between"><h2>Lista inteligente</h2><div class="actions"><button class="secondary" onclick="addAllMissing()">Agregar faltantes</button><button onclick="shopModal()">+ Añadir producto</button></div></div><div class="notice">Antes de agregar una compra se revisan las existencias de la misma unidad. El precio estimado se considera por unidad solicitada; al comprar, el inventario aumenta automáticamente.</div>${shoppingTable()}</section><div class="grid2"><section class="panel"><h3>Resumen de la lista</h3><div class="statline"><span>Pendiente estimado</span><strong>${money(pending())}</strong></div><div class="statline"><span>Gastado en el periodo</span><strong>${money(spent())}</strong></div><div class="statline"><span>Disponible después de pendientes</span><strong>${money(remaining()-pending())}</strong></div>${progress(spent()+pending(),state.budget)}</section><section class="panel"><h3>Faltantes sugeridos</h3>${lowItems().map(i=>`<div class="statline"><span>${esc(i.name)} · ${+(i.min-i.qty).toFixed(3)} ${esc(i.unit)}</span><button class="small secondary" onclick="suggestPurchase('${i.id}')">Añadir</button></div>`).join('')||'<p class="muted">Todos los productos tienen al menos su mínimo.</p>'}</section></div>`}
function shoppingTable(){return state.shopping.length?`<div class="tablewrap"><table><thead><tr><th>Comprado</th><th>Producto</th><th>Cantidad</th><th>Precio estimado/u.</th><th>Precio real/u.</th><th>Subtotal</th><th>Acciones</th></tr></thead><tbody>${state.shopping.map(x=>{let inv=findItem(x.name,x.unit),enough=inv&&inv.qty>=x.qty;return `<tr><td><input type="checkbox" ${x.bought?'checked':''} onchange="toggleBought('${x.id}',this.checked)"></td><td><strong>${esc(x.name)}</strong>${!x.bought&&enough?'<br><span class="pill orange">Ya hay suficiente en casa</span>':''}${x.bought?'<br><span class="pill">Registrado</span>':''}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.estimated)}</td><td>${x.bought?money(x.real):'—'}</td><td><strong>${money(x.qty*(x.bought?x.real:x.estimated))}</strong></td><td><button class="secondary small" onclick="shopModal('${x.id}')">Editar</button> <button class="danger small" onclick="deleteShop('${x.id}')">Quitar</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Tu lista de compras está vacía.</div>'}
function calculatorPage(){let s=spent(),p=pending();return `<div class="cards">${card('Presupuesto inicial',money(state.budget),state.period)}${card('Gasto real',money(s),'Compras pagadas')}${card('Compras previstas',money(p),'Estimación pendiente')}${card('Saldo proyectado',money(state.budget-s-p),'Presupuesto menos gasto y previsión')}</div>${alerts()}<div class="grid2"><section class="panel"><div class="row between"><h2>Calculadora de presupuesto</h2><button class="secondary small" onclick="budgetModal()">Modificar</button></div>${progress(s+p,state.budget)}<div class="statline"><span>Presupuesto inicial</span><strong>${money(state.budget)}</strong></div><div class="statline"><span>Gasto confirmado</span><strong>${money(s)}</strong></div><div class="statline"><span>Saldo real</span><strong>${money(remaining())}</strong></div><div class="statline"><span>Saldo proyectado</span><strong>${money(state.budget-s-p)}</strong></div></section><section class="panel"><h2>Comparación visual</h2>${[['Presupuesto',state.budget,''],['Gasto real',s,''],['Con pendientes',s+p,'alt']].map(([n,v,c])=>`<div class="barrow"><strong>${n}</strong><div class="barbg"><div class="barfill ${c}" style="width:${Math.min(100,state.budget>0?v/state.budget*100:0)}%"></div></div><span>${money(v)}</span></div>`).join('')}<p class="muted">Las barras se limitan visualmente al 100%; los importes muestran el valor completo.</p></section></div>`}
function historyPage(){let records=[...state.history].sort((a,b)=>b.date.localeCompare(a.date)).filter(h=>historyFilter==='todos'||h.period===historyFilter);let groups={};for(let h of records){let k=h.periodStart+' · '+h.period; (groups[k]??=[]).push(h)}return `<section class="panel"><div class="row between"><h2>Historial de compras</h2><select style="max-width:200px" onchange="historyFilter=this.value;render()"><option value="todos">Todos los periodos</option>${['semanal','quincenal','mensual'].map(p=>`<option value="${p}" ${historyFilter===p?'selected':''}>${p}</option>`).join('')}</select></div>${Object.entries(groups).length?Object.entries(groups).map(([k,arr])=>`<h3>${esc(k)} · ${money(arr.reduce((a,h)=>a+h.total,0))}</h3><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Productos</th><th>Total</th><th>Presupuesto del periodo</th><th>Sobrantes al cierre</th></tr></thead><tbody>${arr.map(h=>`<tr><td>${esc(h.date)}</td><td>${(h.items||[]).map(i=>`${esc(i.name)} (${i.qty} ${esc(i.unit)})`).join(', ')||'—'}</td><td>${money(h.total)}</td><td>${money(h.budget)}</td><td>${(h.leftovers||[]).map(i=>esc(i.name)).join(', ')||'—'}</td></tr>`).join('')}</tbody></table></div>`).join(''):'<div class="empty">Todavía no hay compras registradas. Marca un producto como comprado para iniciar el historial.</div>'}</section><section class="panel"><h3>Resumen por periodo</h3>${Object.entries(groups).map(([k,arr])=>`<div class="barrow"><span>${esc(k)}</span><div class="barbg"><div class="barfill" style="width:${Math.min(100,arr.reduce((a,h)=>a+h.total,0)/Math.max(1,...Object.values(groups).map(v=>v.reduce((a,h)=>a+h.total,0)))*100)}%"></div></div><strong>${money(arr.reduce((a,h)=>a+h.total,0))}</strong></div>`).join('')||'<p class="muted">Sin datos para comparar.</p>'}</section>`}
function leftoversPage(){return `<section class="panel"><div class="row between"><h2>Lo que quedó en casa</h2><button onclick="closePeriod()">Registrar cierre del periodo</button></div><p class="muted">Selecciona el estado de cada producto. Los sobrantes no se borran ni se duplican al comenzar otro periodo.</p><div class="tablewrap"><table><thead><tr><th>Producto</th><th>Cantidad actual</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${state.inventory.map(i=>`<tr><td><strong>${esc(i.name)}</strong></td><td>${i.qty} ${esc(i.unit)}</td><td><select id="left-${i.id}" style="min-width:155px"><option value="enough" ${i.qty>=i.min?'selected':''}>Tengo suficiente</option><option value="little" ${i.qty>0&&i.qty<i.min?'selected':''}>Tengo poco</option><option value="empty" ${i.qty===0?'selected':''}>Se terminó</option><option value="expiry" ${i.qty>0&&dayDiff(i.expiry)!==null&&dayDiff(i.expiry)<=7?'selected':''}>Está por caducar</option></select></td><td><button class="secondary small" onclick="applyLeftover('${i.id}')">Actualizar</button> <button class="secondary small" onclick="adjustQty('${i.id}')">Cantidad</button></td></tr>`).join('')}</tbody></table></div></section><div class="notice">“Tengo poco” ajusta la existencia a menos del mínimo si aún había suficiente; “Se terminó” la establece en cero. “Está por caducar” permite actualizar la fecha de vencimiento. El cierre guarda una fotografía de sobrantes en el historial.</div>`}
function expiryPage(){let a=state.inventory.filter(i=>i.qty>0&&i.expiry).filter(i=>expiryFilter==='todos'||expiryStatus(i)===expiryFilter).sort((a,b)=>a.expiry.localeCompare(b.expiry));return `<section class="panel"><div class="row between"><h2>Control de caducidad</h2><select style="max-width:230px" onchange="expiryFilter=this.value;render()"><option value="todos">Todas las fechas</option>${['Por caducar pronto','Caduca esta semana','Caducado','Vigente'].map(x=>`<option ${expiryFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Producto</th><th>Disponible</th><th>Vencimiento</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${a.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty} ${esc(i.unit)}</td><td>${esc(i.expiry)}</td><td><span class="pill ${dayDiff(i.expiry)<0?'red':dayDiff(i.expiry)<=7?'orange':''}">${esc(expiryStatus(i))}</span></td><td><button class="secondary small" onclick="consumeModal('${i.id}')">Registrar consumo</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No hay productos en esta clasificación.</td></tr>'}</tbody></table></div></section><div class="notice warn">Prioriza el consumo de productos próximos a vencer. No consumas productos caducados si su seguridad no está garantizada.</div>`}
function mealsPage(){let priority=state.inventory.filter(i=>i.qty>0&&i.expiry&&dayDiff(i.expiry)>=0&&dayDiff(i.expiry)<=7).sort((a,b)=>a.expiry.localeCompare(b.expiry));return `<div class="grid2"><section class="panel"><div class="row between"><h2>Plan de comidas</h2><button onclick="mealModal()">+ Planear comida</button></div>${state.meals.length?state.meals.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(m=>`<div class="statline"><div><strong>${esc(m.name)}</strong><br><small>${esc(m.date)} · ${m.ingredients.map(id=>state.inventory.find(i=>i.id===id)?.name||'Ingrediente eliminado').map(esc).join(', ')}</small></div><button class="danger small" onclick="deleteMeal('${m.id}')">Eliminar</button></div>`).join(''):'<div class="empty">Aún no hay comidas planeadas.</div>'}</section><section class="panel"><h2>Ingredientes para aprovechar primero</h2>${priority.map(i=>`<div class="statline"><span>${esc(i.name)} · ${i.qty} ${esc(i.unit)}</span><span class="pill orange">${esc(i.expiry)}</span></div>`).join('')||'<p class="muted">No hay ingredientes próximos a caducar.</p>'}<h3 style="margin-top:22px">Ideas para aprovechar</h3><p class="muted">Combina los ingredientes disponibles en ensaladas, guisos, sopas, salteados o acompañamientos, según el tipo de alimento y su estado.</p></section></div><div class="notice">Planificar una comida no descuenta ingredientes automáticamente. Registra el consumo real desde inventario o caducidades para mantener cantidades exactas.</div>`}
function modal(title,body,submit){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>${title}</h2><button class="secondary small" onclick="closeModal()">✕</button></div><form id="modalForm" onsubmit="event.preventDefault();${submit}">${body}<div class="actions" style="margin-top:20px;justify-content:flex-end"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button type="submit">Guardar</button></div></form></div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function field(name,label,type='text',value='',extra=''){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(name,label,options,value){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}function formData(){return Object.fromEntries(new FormData(document.getElementById('modalForm')))}
function itemModal(id){let i=state.inventory.find(x=>x.id===id)||{name:'',category:'Abarrotes',qty:0,unit:'piezas',min:1,bought:today(),expiry:'',price:0};modal(id?'Editar producto':'Nuevo producto',`<div class="formgrid">${field('name','Nombre','text',i.name,'required maxlength="100"')}${selectField('category','Categoría',state.categories,i.category)}${selectField('unit','Unidad',units,i.unit)}${field('qty','Cantidad disponible','number',i.qty,'required min="0" step="any"')}${field('min','Existencia mínima','number',i.min,'required min="0" step="any"')}${field('price','Precio pagado (MXN)','number',i.price,'required min="0" step="0.01"')}${field('bought','Fecha de compra','date',i.bought)}${field('expiry','Caducidad','date',i.expiry)}</div>`,`saveItem('${id||''}')`)}function saveItem(id){let f=formData();f.name=f.name.trim();if(!f.name)return alert('Escribe un nombre.');let duplicate=state.inventory.find(i=>i.id!==id&&normalize(i.name)===normalize(f.name)&&i.unit===f.unit);if(duplicate)return alert('Ya existe este producto con la misma unidad. Edita su cantidad en vez de duplicarlo.');let obj={id:id||uid(),name:f.name,category:f.category,unit:f.unit,qty:num(f.qty),min:num(f.min),price:num(f.price),bought:f.bought,expiry:f.expiry};if(id)state.inventory=state.inventory.map(i=>i.id===id?obj:i);else state.inventory.push(obj);save();closeModal();render()}
function deleteItem(id){let i=state.inventory.find(x=>x.id===id);if(confirm(`¿Eliminar ${i.name} del inventario? Esta acción no modifica compras históricas.`)){state.inventory=state.inventory.filter(x=>x.id!==id);save();render()}}function adjustQty(id){let i=state.inventory.find(x=>x.id===id);modal('Actualizar cantidad: '+esc(i.name),`<div class="formgrid">${field('qty','Cantidad disponible ('+esc(i.unit)+')','number',i.qty,'required min="0" step="any"')}</div>`,`setQty('${id}')`)}function setQty(id){let i=state.inventory.find(x=>x.id===id);i.qty=num(formData().qty);save();closeModal();render()}function consumeModal(id){let i=state.inventory.find(x=>x.id===id);modal('Registrar consumo: '+esc(i.name),`<p>Disponible: ${i.qty} ${esc(i.unit)}</p><div class="formgrid">${field('qty','Cantidad consumida','number',Math.min(1,i.qty),'required min="0.001" step="any" max="'+i.qty+'"')}</div>`,`consume('${id}')`)}function consume(id){let i=state.inventory.find(x=>x.id===id),q=num(formData().qty);if(q<=0||q>i.qty)return alert('La cantidad debe ser mayor a cero y no superar lo disponible.');i.qty=+(i.qty-q).toFixed(4);state.savings=+(num(state.savings)+q*num(i.price)).toFixed(2);save();closeModal();render()}
function categoryModal(){modal('Nueva categoría',field('name','Nombre de categoría','text','','required maxlength="60"'),`saveCategory()`)}function saveCategory(){let n=formData().name.trim();if(state.categories.some(c=>normalize(c)===normalize(n)))return alert('La categoría ya existe.');state.categories.push(n);save();closeModal();render()}
function budgetModal(){modal('Configurar presupuesto',`<div class="formgrid">${field('budget','Presupuesto (MXN)','number',state.budget,'required min="0" step="0.01"')}${selectField('period','Periodo',['semanal','quincenal','mensual'],state.period)}${field('start','Inicio del periodo','date',state.periodStart,'required')}</div><div class="notice warn">Cambiar la fecha o duración del periodo recalcula qué compras pertenecen al periodo activo; no elimina registros.</div>`,`saveBudget()`)}function saveBudget(){let f=formData();state.budget=num(f.budget);state.period=f.period;state.periodStart=f.start;save();closeModal();render()}
function shopModal(id,prefill){let x=state.shopping.find(i=>i.id===id)||{name:prefill?.name||'',qty:prefill?.qty||1,unit:prefill?.unit||'piezas',estimated:prefill?.estimated||0,real:0,bought:false};if(x.bought)return alert('Una compra registrada no se puede editar desde la lista. Puedes ajustar el inventario y consultar el historial.');modal(id?'Editar compra':'Añadir a la lista',`<div class="formgrid">${field('name','Producto','text',x.name,'required maxlength="100"')}${selectField('unit','Unidad',units,x.unit)}${field('qty','Cantidad necesaria','number',x.qty,'required min="0.001" step="any"')}${field('estimated','Precio estimado por unidad (MXN)','number',x.estimated,'required min="0" step="0.01"')}</div><div class="notice">El sistema comparará la cantidad solicitada con el inventario antes de agregarla.</div>`,`saveShop('${id||''}')`)}function saveShop(id){let f=formData(),name=f.name.trim(),qty=num(f.qty);if(!name||qty<=0)return alert('Ingresa un producto y una cantidad válida.');let inv=findItem(name,f.unit),available=inv?num(inv.qty):0;let otherPending=state.shopping.filter(x=>!x.bought&&x.id!==id&&normalize(x.name)===normalize(name)&&x.unit===f.unit).reduce((a,x)=>a+x.qty,0);let needed=Math.max(0,qty-available-otherPending);if(needed===0){alert('¡Ya tienes este producto en casa! No necesitas comprarlo todavía (o ya está en la lista).');return}if(needed<qty&&!confirm(`Tienes ${available} ${f.unit} en casa y ${otherPending} ${f.unit} pendientes. Solo necesitas añadir ${needed} ${f.unit}. ¿Ajustar la cantidad?`))return;qty=needed;let obj={id:id||uid(),name,unit:f.unit,qty,estimated:num(f.estimated),real:0,bought:false,date:'',inventoryId:inv?.id||''};if(id)state.shopping=state.shopping.map(x=>x.id===id?obj:x);else state.shopping.push(obj);if(spent()+pending()>state.budget&&!confirm('⚠ Esta compra hará que el total previsto supere tu presupuesto. ¿Quieres mantenerla?')){if(id){}else state.shopping.pop();return}save();closeModal();render()}
function suggestPurchase(id){let i=state.inventory.find(x=>x.id===id);let missing=Math.max(0,i.min-i.qty-state.shopping.filter(x=>!x.bought&&normalize(x.name)===normalize(i.name)&&x.unit===i.unit).reduce((a,x)=>a+x.qty,0));if(missing<=0)return alert('¡Ya tienes este producto en casa! No necesitas comprarlo todavía (o ya está en la lista).');shopModal('',{name:i.name,unit:i.unit,qty:missing,estimated:i.price})}function addAllMissing(){let added=0;for(let i of lowItems()){let q=Math.max(0,i.min-i.qty-state.shopping.filter(x=>!x.bought&&normalize(x.name)===normalize(i.name)&&x.unit===i.unit).reduce((a,x)=>a+x.qty,0));if(q>0){state.shopping.push({id:uid(),name:i.name,qty:+q.toFixed(4),unit:i.unit,estimated:num(i.price),real:0,bought:false,date:'',inventoryId:i.id});added++}}if(!added)return alert('No hay faltantes nuevos para agregar.');if(spent()+pending()>state.budget&&!confirm('⚠ Los faltantes exceden el presupuesto previsto. ¿Mantenerlos en la lista?')){state.shopping.splice(-added,added);return}save();render()}
function deleteShop(id){let x=state.shopping.find(i=>i.id===id);if(x.bought)return alert('La compra ya está registrada en el historial. No se puede quitar de la lista sin afectar la trazabilidad.');if(confirm('¿Quitar este producto de la lista de compras?')){state.shopping=state.shopping.filter(x=>x.id!==id);save();render()}}
function toggleBought(id,checked){let x=state.shopping.find(i=>i.id===id);if(!x)return;if(!checked){alert('Las compras ya registradas no se pueden desmarcar: se conservarán en el historial. Puedes modificar manualmente el inventario.');render();return}modal('Confirmar compra: '+esc(x.name),`<p>${x.qty} ${esc(x.unit)} · precio estimado por unidad ${money(x.estimated)}</p><div class="formgrid">${field('real','Precio real por unidad (MXN)','number',x.estimated,'required min="0" step="0.01"')}${field('date','Fecha de compra','date',today(),'required')}</div><div class="notice">Total: cantidad × precio real. Se añadirá al inventario y al historial.</div>`,`completePurchase('${id}')`)}
function completePurchase(id){let x=state.shopping.find(i=>i.id===id),f=formData(),total=x.qty*num(f.real);let start=state.periodStart,end=endPeriod();if(f.date<start||f.date>=end){if(!confirm('La fecha está fuera del periodo activo. Se guardará en el historial, pero no contará en el presupuesto actual. ¿Continuar?'))return}if(f.date>=start&&f.date<end&&spent()+total>state.budget&&!confirm(`⚠ La compra excederá el presupuesto por ${money(spent()+total-state.budget)}. ¿Registrar de todos modos?`))return;let i=findItem(x.name,x.unit);if(i){i.qty=+(i.qty+x.qty).toFixed(4);i.bought=f.date;i.price=num(f.real)}else{state.inventory.push({id:uid(),name:x.name,category:'Otros',qty:x.qty,unit:x.unit,min:1,bought:f.date,expiry:'',price:num(f.real)})}x.bought=true;x.real=num(f.real);x.date=f.date;state.history.push({id:uid(),date:f.date,period:state.period,periodStart:state.periodStart,budget:state.budget,total,items:[{name:x.name,qty:x.qty,unit:x.unit,price:x.real}],leftovers:[]});save();closeModal();render()}
function applyLeftover(id){let i=state.inventory.find(x=>x.id===id),v=document.getElementById('left-'+id).value;if(v==='empty'){if(!confirm('¿Confirmas que se terminó '+i.name+'? La cantidad pasará a cero.'))return;i.qty=0}else if(v==='little'){if(i.qty>=i.min)i.qty=i.min>0?+(i.min*.5).toFixed(4):i.qty;alert('Estado registrado. Puedes ajustar la cantidad exacta con el botón Cantidad.')}else if(v==='expiry'){let d=prompt('Fecha de caducidad (AAAA-MM-DD):',i.expiry||today());if(d===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert('Fecha no válida.');i.expiry=d}else if(v==='enough'&&i.qty<i.min){alert('La cantidad es inferior al mínimo. Actualiza la cantidad para indicar que tienes suficiente.');return}save();render()}
function snapshot(){return state.inventory.filter(i=>i.qty>0).map(i=>({name:i.name,qty:i.qty,unit:i.unit}))}function closePeriod(){if(!confirm('¿Guardar una fotografía de los sobrantes actuales en el historial? No se borrará ningún producto.'))return;state.history.push({id:uid(),date:today(),period:state.period,periodStart:state.periodStart,budget:state.budget,total:0,items:[],leftovers:snapshot()});save();alert('Sobrantes registrados. El inventario permanece intacto.');render()}function resetPeriod(){if(!confirm('¿Iniciar un periodo nuevo hoy? Se conserva el inventario, la lista pendiente y el historial.'))return;state.history.push({id:uid(),date:today(),period:state.period,periodStart:state.periodStart,budget:state.budget,total:0,items:[],leftovers:snapshot()});state.periodStart=today();state.shopping=state.shopping.filter(x=>!x.bought);save();render()}
function mealModal(){let opts=state.inventory.filter(i=>i.qty>0);modal('Planear comida',`<div class="formgrid">${field('name','Nombre de la comida','text','','required maxlength="100"')}${field('date','Fecha','date',today(),'required')}</div><h3 style="margin-top:20px">Ingredientes disponibles</h3><div style="max-height:230px;overflow:auto">${opts.map(i=>`<label style="font-size:14px;font-weight:500;margin:10px 0"><input style="width:auto" type="checkbox" name="ingredients" value="${i.id}"> ${esc(i.name)} · ${i.qty} ${esc(i.unit)} ${dayDiff(i.expiry)!==null&&dayDiff(i.expiry)<=7?'· priorizar':''}</label>`).join('')||'<p>Agrega ingredientes al inventario primero.</p>'}</div>`,`saveMeal()`)}function saveMeal(){let f=new FormData(document.getElementById('modalForm'));state.meals.push({id:uid(),name:String(f.get('name')).trim(),date:f.get('date'),ingredients:f.getAll('ingredients')});save();closeModal();render()}function deleteMeal(id){if(confirm('¿Eliminar esta comida del plan?')){state.meals=state.meals.filter(x=>x.id!==id);save();render()}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-despensa-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x||!Array.isArray(x.inventory)||!Array.isArray(x.shopping)||!Array.isArray(x.history)||!Array.isArray(x.categories)||!['semanal','quincenal','mensual'].includes(x.period)||typeof x.budget!=='number')throw Error('Formato no compatible');if(!confirm('¿Reemplazar TODOS los datos actuales con los del archivo? Exporta una copia antes si deseas conservarlos.'))return;state=x;state.meals=state.meals||[];state.savings=num(state.savings);save();render();alert('Datos importados correctamente.')}catch(err){alert('No se pudo importar: '+err.message)}finally{e.target.value=''}}
// El ahorro estimado aumenta al registrar consumo de productos existentes,
// valorado con el último precio unitario registrado. No es un ahorro bancario comprobado.
render();save();
</script></body></html>
